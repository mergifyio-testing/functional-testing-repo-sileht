partition_rules:
- fallback_partition: true
  name: fallback_partition
- conditions:
  - files~=^projA/
  name: projA
- conditions:
  - files~=^projB/
  name: projB
pull_request_rules:
- actions:
    queue:
      name: default
  conditions:
  - base=20251020165619/test_no_partition_reset_when_pr_manual_merge/main
  - label=queue
  name: Automatic merge
queue_rules:
- merge_conditions:
  - status-success=continuous-integration/fake-ci
  name: default
